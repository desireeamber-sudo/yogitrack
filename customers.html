<!DOCTYPE html>
<html>
<head>
    <title>Customer List</title>
</head>
<body>

<h2>Customer List</h2>

<a href="index.html">Home</a>
<br><br>
<a href="add-customer.html">Add New Customer</a>
<br><br>

<table border="1" id="customerTable">
    <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
async function loadCustomers() {
    const response = await fetch("/customers");
    const result = await response.json();
    const customers = result.data;

    const tableBody = document.querySelector("#customerTable tbody");
    tableBody.innerHTML = "";

    customers.forEach(customer => {
        const row = `
            <tr>
                <td>${customer.firstName}</td>
                <td>${customer.lastName}</td>
                <td>${customer.email}</td>
                <td>${customer.phone}</td>
                <td>
                    <button onclick="editCustomer('${customer._id}')">
                        Edit
                    </button>
                    </td>
                <td>
                    <button onclick="deleteCustomer('${customer._id}')">
                        Delete</button>
                </td>
            </tr>
        `;

        tableBody.innerHTML += row;
    });
}

async function deleteCustomer(id) {
    const confirmDelete = confirm("Are you sure you want to delete this customer?");
    if (!confirmDelete) return;

    await fetch(`/customers/${id}`, {
    method: "DELETE"
});
    loadCustomers();
}

function editCustomer(id) {
    window.location.href = `edit-customer.html?id=${id}`;
}

loadCustomers();
</script>

</body>
</html>
