<!DOCTYPE html>
<!-- packages list page -->
<html>
<head>
    <title>Package List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Package List</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="add-package.html">Add New Package</a>
    </div>

    <table id="packageTable">
        <thead>
            <tr>
                <th>Package ID<br><input class="col-filter" id="filterId" placeholder="Filter..."></th>
                <th>Package Name<br><input class="col-filter" id="filterName" placeholder="Filter..."></th>
                <th>Category<br>
                    <select class="col-filter" id="filterCategory">
                        <option value="">All</option>
                        <option value="General">General</option>
                        <option value="Senior">Senior</option>
                    </select>
                </th>
                <th>No. of Classes<br>
                    <select class="col-filter" id="filterClasses">
                        <option value="">All</option>
                        <option value="1">1</option>
                        <option value="4">4</option>
                        <option value="10">10</option>
                        <option value="Unlimited">Unlimited</option>
                    </select>
                </th>
                <th>Class Type<br>
                    <select class="col-filter" id="filterClassType">
                        <option value="">All</option>
                        <option value="General">General</option>
                        <option value="Special">Special</option>
                    </select>
                </th>
                <th>Start Date<br><input class="col-filter" id="filterStart" placeholder="Filter..."></th>
                <th>End Date<br><input class="col-filter" id="filterEnd" placeholder="Filter..."></th>
                <th>Price<br><input class="col-filter" id="filterPrice" placeholder="Filter..."></th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="checkManagerRole.js"></script>
<script>
let allPackages = [];

async function loadPackages() {
    const response = await fetch("/packages");
    const result = await response.json();
    allPackages = result.data;
    renderTable(allPackages);
}

function renderTable(packages) {
    let rows = "";
    packages.forEach(p => {
        const classTypeTag = p.classType === "General"
            ? `<span class="tag tag-customer">General</span>`
            : `<span class="tag tag-instructor">Special</span>`;
        const categoryTag = p.category === "General"
            ? `<span class="tag tag-customer">General</span>`
            : `<span class="tag tag-instructor">Senior</span>`;
        rows += `
            <tr>
                <td>${p.packageId || "N/A"}</td>
                <td>${p.packageName || ""}</td>
                <td>${categoryTag}</td>
                <td>${p.numberOfClasses || ""}</td>
                <td>${classTypeTag}</td>
                <td>${p.startDate ? new Date(p.startDate).toLocaleDateString() : ""}</td>
                <td>${p.endDate ? new Date(p.endDate).toLocaleDateString() : ""}</td>
                <td>$${p.price ?? ""}</td>
                <td>
                    <button class="btn-edit" onclick="editPackage('${p._id}')">Edit</button>
                    <button class="btn-delete" onclick="deletePackage('${p._id}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#packageTable tbody").innerHTML = rows;
}

function applyFilters() {
    const id        = document.getElementById("filterId").value.toLowerCase();
    const name      = document.getElementById("filterName").value.toLowerCase();
    const category  = document.getElementById("filterCategory").value;
    const classes   = document.getElementById("filterClasses").value;
    const classType = document.getElementById("filterClassType").value;
    const start     = document.getElementById("filterStart").value.toLowerCase();
    const end       = document.getElementById("filterEnd").value.toLowerCase();
    const price     = document.getElementById("filterPrice").value.toLowerCase();

    const filtered = allPackages.filter(p =>
        (!id        || (p.packageId || "").toLowerCase().includes(id)) &&
        (!name      || (p.packageName || "").toLowerCase().includes(name)) &&
        (!category  || p.category === category) &&
        (!classes   || p.numberOfClasses === classes) &&
        (!classType || p.classType === classType) &&
        (!start     || new Date(p.startDate).toLocaleDateString().toLowerCase().includes(start)) &&
        (!end       || new Date(p.endDate).toLocaleDateString().toLowerCase().includes(end)) &&
        (!price     || String(p.price).includes(price))
    );
    renderTable(filtered);
}

["filterId","filterName","filterStart","filterEnd","filterPrice"]
    .forEach(id => document.getElementById(id).addEventListener("input", applyFilters));
["filterCategory","filterClasses","filterClassType"]
    .forEach(id => document.getElementById(id).addEventListener("change", applyFilters));

async function deletePackage(id) {
    if (!confirm("Are you sure you want to delete this package?")) return;
    await fetch(`/packages/${id}`, { method: "DELETE" });
    loadPackages();
}

function editPackage(id) {
    window.location.href = `edit-package.html?id=${id}`;
}

loadPackages();
</script>
</body>
</html>
