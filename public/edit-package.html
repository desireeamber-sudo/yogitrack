<!DOCTYPE html>
<!-- edit package form - loads existing data from url id param -->
<html>
<head>
    <title>Edit Package</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Edit Package</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="packages.html">Back to Package List</a>
    </div>

    <form id="editForm">
        <label>Package Name:</label><br>
        <input type="text" id="packageName" required><br><br>

        <label>Category:</label><br>
        <select id="category" required>
            <option value="">Select one</option>
            <option value="General">General</option>
            <option value="Senior">Senior</option>
        </select><br><br>

        <label>Number of Classes:</label><br>
        <select id="numberOfClasses" required>
            <option value="">Select one</option>
            <option value="1">1 (Drop-in)</option>
            <option value="4">4</option>
            <option value="10">10</option>
            <option value="Unlimited">Unlimited</option>
        </select><br><br>

        <label>Class Type:</label><br>
        <select id="classType" required>
            <option value="">Select one</option>
            <option value="General">General</option>
            <option value="Special">Special</option>
        </select><br><br>

        <label>Start Date:</label><br>
        <input type="date" id="startDate" required><br><br>

        <label>End Date:</label><br>
        <input type="date" id="endDate" required><br><br>

        <label>Price ($):</label><br>
        <input type="number" id="price" min="0" step="0.01" required><br><br>

        <button type="submit">Update Package</button>
    </form>
</div>

<script>
// get id from url
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// load existing package into form
async function loadPackage() {
    const result = await fetch(`/packages/${id}`).then(r => r.json());
    const p = result.data;
    document.getElementById("packageName").value = p.packageName;
    document.getElementById("category").value = p.category;
    document.getElementById("numberOfClasses").value = p.numberOfClasses;
    document.getElementById("classType").value = p.classType;
    document.getElementById("startDate").value = p.startDate ? p.startDate.split("T")[0] : "";
    document.getElementById("endDate").value = p.endDate ? p.endDate.split("T")[0] : "";
    document.getElementById("price").value = p.price;
}

// save changes
document.getElementById("editForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    await fetch(`/packages/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            packageName: document.getElementById("packageName").value,
            category: document.getElementById("category").value,
            numberOfClasses: document.getElementById("numberOfClasses").value,
            classType: document.getElementById("classType").value,
            startDate: document.getElementById("startDate").value,
            endDate: document.getElementById("endDate").value,
            price: parseFloat(document.getElementById("price").value)
        })
    });
    alert("Package updated");
    window.location.href = "packages.html";
});

loadPackage();
</script>
</body>
</html>
