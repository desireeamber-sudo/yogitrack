<!DOCTYPE html>
<!-- user management page - manager only -->
<html>
<head>
    <title>Manage Users</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Manage Users</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register New User</a>
    </div>

    <table id="userTable">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="checkManagerRole.js"></script>
<script>
    // load and render all users
async function loadUsers() {
    const response = await fetch("/auth/users");
    const result = await response.json();
    const users = result.data;

    let rows = "";
    users.forEach(u => {
        rows += `
            <tr>
                <td>${u.fullName}</td>
                <td>${u.email}</td>
                <td>${u.role}</td>
                <td>
                    <button class="btn-edit" onclick="editUser('${u._id}')">Edit</button>
                    <button class="btn-delete" onclick="deleteUser('${u._id}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#userTable tbody").innerHTML = rows;
}
// go to edit form with user id in query string  
function editUser(id) {
    window.location.href = `edit-user.html?id=${id}`;
}
// confirm and delete user, then reload table
async function deleteUser(id) {
    if (!confirm("Are you sure you want to delete this user?")) return;
    await fetch(`/auth/users/${id}`, { method: "DELETE" });
    loadUsers();
}

loadUsers();
</script>
</body>
</html>
