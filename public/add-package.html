<!DOCTYPE html>
<!-- add package form -->
<html>
<head>
    <title>Add Package</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Add Package</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="packages.html">Back to Package List</a>
    </div>

    <form id="packageForm">
        <label>Package Name:</label><br>
        <input type="text" id="packageName" required><br><br>

        <label>Category:</label><br>
        <select id="category" required>
            <option value="">Select one</option>
            <option value="General">General</option>
            <option value="Senior">Senior</option>
        </select><br><br>

        <label>Number of Classes:</label><br>
        <select id="numberOfClasses" required>
            <option value="">Select one</option>
            <option value="1">1 (Drop-in)</option>
            <option value="4">4</option>
            <option value="10">10</option>
            <option value="Unlimited">Unlimited</option>
        </select><br><br>

        <label>Class Type:</label><br>
        <select id="classType" required>
            <option value="">Select one</option>
            <option value="General">General</option>
            <option value="Special">Special</option>
        </select><br><br>

        <label>Start Date:</label><br>
        <input type="date" id="startDate" required><br><br>

        <label>End Date:</label><br>
        <input type="date" id="endDate" required><br><br>

        <label>Price ($):</label><br>
        <input type="number" id="price" min="0" step="0.01" required><br><br>

        <button type="submit">Add Package</button>
    </form>
</div>

<script>
// submit new package
document.getElementById("packageForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const package_ = {
        packageName: document.getElementById("packageName").value,
        category: document.getElementById("category").value,
        numberOfClasses: document.getElementById("numberOfClasses").value,
        classType: document.getElementById("classType").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value,
        price: parseFloat(document.getElementById("price").value)
    };

    const response = await fetch("/packages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(package_)
    });

    const result = await response.json();
    if (!response.ok) { alert(result.message); return; }

    alert(`Package added! Package ID is ${result.data.packageId}.`);
    window.location.href = "packages.html";
});
</script>
</body>
</html>
