<!DOCTYPE html>
<!-- attendance records list -->
<html>
<head>
    <title>Attendance Records</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Attendance Records</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="record-attendance.html">Record Attendance</a>
    </div>

    <table id="attendanceTable">
        <thead>
            <tr>
                <th>Attendance ID<br><input class="col-filter" id="filterId" placeholder="Filter..."></th>
                <th>Class ID<br><input class="col-filter" id="filterClass" placeholder="Filter..."></th>
                <th>Date<br><input class="col-filter" id="filterDate" placeholder="Filter..."></th>
                <th>Customers<br><input class="col-filter" id="filterCustomers" placeholder="Filter..."></th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let allAttendance = [];

async function loadAttendance() {
    const response = await fetch("/attendance");
    const result = await response.json();
    allAttendance = result.data;
    renderTable(allAttendance);
}

function renderTable(records) {
    let rows = "";
    records.forEach(r => {
        rows += `
            <tr>
                <td>${r.attendanceId || "N/A"}</td>
                <td>${r.classId || ""}</td>
                <td>${r.date ? new Date(r.date).toLocaleDateString() : ""}</td>
                <td>${r.customers ? r.customers.join(", ") : ""}</td>
                <td>
                    <button class="btn-delete" onclick="deleteRecord('${r._id}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#attendanceTable tbody").innerHTML = rows;
}

function applyFilters() {
    const id        = document.getElementById("filterId").value.toLowerCase();
    const classId   = document.getElementById("filterClass").value.toLowerCase();
    const date      = document.getElementById("filterDate").value.toLowerCase();
    const customers = document.getElementById("filterCustomers").value.toLowerCase();

    const filtered = allAttendance.filter(r =>
        (!id        || (r.attendanceId || "").toLowerCase().includes(id)) &&
        (!classId   || (r.classId || "").toLowerCase().includes(classId)) &&
        (!date      || new Date(r.date).toLocaleDateString().toLowerCase().includes(date)) &&
        (!customers || (r.customers || []).join(", ").toLowerCase().includes(customers))
    );
    renderTable(filtered);
}

["filterId","filterClass","filterDate","filterCustomers"]
    .forEach(id => document.getElementById(id).addEventListener("input", applyFilters));

async function deleteRecord(id) {
    if (!confirm("Are you sure you want to delete this attendance record?")) return;
    await fetch(`/attendance/${id}`, { method: "DELETE" });
    loadAttendance();
}

loadAttendance();
</script>
</body>
</html>
