<!DOCTYPE html>
<!-- class schedule list page -->
<html>
<head>
    <title>Class Schedule</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Class Schedule</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="add-class.html">Add New Class</a>
    </div>

    <table id="classTable">
        <thead>
            <tr>
                <th>Class ID<br><input class="col-filter" id="filterId" placeholder="Filter..."></th>
                <th>Instructor ID<br><input class="col-filter" id="filterInstructor" placeholder="Filter..."></th>
                <th>Day<br>
                    <select class="col-filter" id="filterDay">
                        <option value="">All</option>
                        <option value="Sunday">Sunday</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                    </select>
                </th>
                <th>Time<br><input class="col-filter" id="filterTime" placeholder="Filter..."></th>
                <th>Class Type<br>
                    <select class="col-filter" id="filterClassType">
                        <option value="">All</option>
                        <option value="General">General</option>
                        <option value="Special">Special</option>
                    </select>
                </th>
                <th>Pay Rate<br><input class="col-filter" id="filterPayRate" placeholder="Filter..."></th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="checkManagerRole.js"></script>
<script>
let allClasses = [];

async function loadClasses() {
    const response = await fetch("/classes");
    const result = await response.json();
    allClasses = result.data;
    renderTable(allClasses);
}

function renderTable(classes) {
    let rows = "";
    classes.forEach(c => {
        rows += `
            <tr>
                <td>${c.classId || "N/A"}</td>
                <td>${c.instructorId || ""}</td>
                <td>${c.day || ""}</td>
                <td>${c.time || ""}</td>
                <td>${c.classType || ""}</td>
                <td>$${c.payRate ?? ""}/hr</td>
                <td>
                    <button class="btn-edit" onclick="editClass('${c._id}')">Edit</button>
                    <button class="btn-delete" onclick="deleteClass('${c._id}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#classTable tbody").innerHTML = rows;
}

function applyFilters() {
    const id         = document.getElementById("filterId").value.toLowerCase();
    const instructor = document.getElementById("filterInstructor").value.toLowerCase();
    const day        = document.getElementById("filterDay").value;
    const time       = document.getElementById("filterTime").value.toLowerCase();
    const classType  = document.getElementById("filterClassType").value;
    const payRate    = document.getElementById("filterPayRate").value.toLowerCase();

    const filtered = allClasses.filter(c =>
        (!id         || (c.classId || "").toLowerCase().includes(id)) &&
        (!instructor || (c.instructorId || "").toLowerCase().includes(instructor)) &&
        (!day        || c.day === day) &&
        (!time       || (c.time || "").toLowerCase().includes(time)) &&
        (!classType  || c.classType === classType) &&
        (!payRate    || String(c.payRate).includes(payRate))
    );
    renderTable(filtered);
}

["filterId","filterInstructor","filterTime","filterPayRate"]
    .forEach(id => document.getElementById(id).addEventListener("input", applyFilters));
["filterDay","filterClassType"]
    .forEach(id => document.getElementById(id).addEventListener("change", applyFilters));

async function deleteClass(id) {
    if (!confirm("Are you sure you want to delete this class?")) return;
    await fetch(`/classes/${id}`, { method: "DELETE" });
    loadClasses();
}

function editClass(id) {
    window.location.href = `edit-class.html?id=${id}`;
}

loadClasses();
</script>
</body>
</html>
