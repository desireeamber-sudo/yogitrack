<!DOCTYPE html>
<html>
<head>
    <title>People List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>People List</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
    </div>

    <table id="peopleTable">
        <thead>
            <tr>
                <th>ID<br><input class="col-filter" id="filterId" placeholder="Filter..."></th>
                <th>Type<br>
                    <select class="col-filter" id="filterType">
                        <option value="">All</option>
                        <option value="Customer">Customer</option>
                        <option value="Instructor">Instructor</option>
                    </select>
                </th>
                <th>First Name<br><input class="col-filter" id="filterFirst" placeholder="Filter..."></th>
                <th>Last Name<br><input class="col-filter" id="filterLast" placeholder="Filter..."></th>
                <th>Address<br><input class="col-filter" id="filterAddress" placeholder="Filter..."></th>
                <th>Email<br><input class="col-filter" id="filterEmail" placeholder="Filter..."></th>
                <th>Phone<br><input class="col-filter" id="filterPhone" placeholder="Filter..."></th>
                <th>Pref. Contact<br>
                    <select class="col-filter" id="filterContact">
                        <option value="">All</option>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                    </select>
                </th>
                <th>Balance<br><input class="col-filter" id="filterBalance" placeholder="Filter..."></th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let allPeople = [];

async function loadPeople() {
    const customerResponse = await fetch("/customers");
    const customerResult = await customerResponse.json();
    const customers = customerResult.data || [];

    const instructorResponse = await fetch("/instructors");
    const instructorResult = await instructorResponse.json();
    const instructors = instructorResult.data || [];

    allPeople = [
        ...customers.map(c => ({
            id: c.customerId || "N/A", recordId: c._id, type: "Customer",
            firstName: c.firstName || "", lastName: c.lastName || "",
            address: c.address || "N/A", email: c.email || "",
            phone: c.phone || "", preferredContact: c.preferredContact || "N/A",
            classBalance: String(c.classBalance ?? 0)
        })),
        ...instructors.map(i => ({
            id: i.instructorId || "N/A", recordId: i._id, type: "Instructor",
            firstName: i.firstName || "", lastName: i.lastName || "",
            address: i.address || "N/A", email: i.email || "",
            phone: i.phone || "", preferredContact: i.preferredContact || "N/A",
            classBalance: "—"
        }))
    ];

    allPeople.sort((a, b) => a.id.localeCompare(b.id));
    renderTable(allPeople);
}

function renderTable(people) {
    let rows = "";
    people.forEach(person => {
        const typeTag = person.type === "Customer"
            ? `<span class="tag tag-customer">Customer</span>`
            : `<span class="tag tag-instructor">Instructor</span>`;
        rows += `
            <tr>
                <td>${person.id}</td>
                <td>${typeTag}</td>
                <td>${person.firstName}</td>
                <td>${person.lastName}</td>
                <td>${person.address}</td>
                <td>${person.email}</td>
                <td>${person.phone}</td>
                <td>${person.preferredContact}</td>
                <td>${person.classBalance}</td>
                <td>
                    <button class="btn-edit" onclick="editPerson('${person.type}', '${person.recordId}')">Edit</button>
                    <button class="btn-delete" onclick="deletePerson('${person.type}', '${person.recordId}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#peopleTable tbody").innerHTML = rows;
}

function applyFilters() {
    const id      = document.getElementById("filterId").value.toLowerCase();
    const type    = document.getElementById("filterType").value;
    const first   = document.getElementById("filterFirst").value.toLowerCase();
    const last    = document.getElementById("filterLast").value.toLowerCase();
    const address = document.getElementById("filterAddress").value.toLowerCase();
    const email   = document.getElementById("filterEmail").value.toLowerCase();
    const phone   = document.getElementById("filterPhone").value.toLowerCase();
    const contact = document.getElementById("filterContact").value;
    const balance = document.getElementById("filterBalance").value.toLowerCase();

    const filtered = allPeople.filter(p =>
        (!id      || p.id.toLowerCase().includes(id)) &&
        (!type    || p.type === type) &&
        (!first   || p.firstName.toLowerCase().includes(first)) &&
        (!last    || p.lastName.toLowerCase().includes(last)) &&
        (!address || p.address.toLowerCase().includes(address)) &&
        (!email   || p.email.toLowerCase().includes(email)) &&
        (!phone   || p.phone.toLowerCase().includes(phone)) &&
        (!contact || p.preferredContact === contact) &&
        (!balance || p.classBalance.toLowerCase().includes(balance))
    );

    renderTable(filtered);
}

["filterId","filterType","filterFirst","filterLast","filterAddress",
 "filterEmail","filterPhone","filterContact","filterBalance"
].forEach(id => document.getElementById(id).addEventListener("input", applyFilters));
document.getElementById("filterType").addEventListener("change", applyFilters);
document.getElementById("filterContact").addEventListener("change", applyFilters);

loadPeople();

function editPerson(type, id) {
    window.location.href = type === "Customer"
        ? `edit-customer.html?id=${id}`
        : `edit-instructor.html?id=${id}`;
}

async function deletePerson(type, id) {
    if (!confirm(`Are you sure you want to delete this ${type.toLowerCase()}?`)) return;
    const route = type === "Customer" ? "/customers" : "/instructors";
    await fetch(`${route}/${id}`, { method: "DELETE" });
    loadPeople();
}
</script>
</body>
</html>
