<!DOCTYPE html>
<!-- customer list page -->
<html>
<head>
    <title>Customer List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Customer List</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="add-customer.html">Add New Customer</a>
    </div>

    <table id="customerTable">
        <thead>
            <tr>
                <th>Customer ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Address</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Pref. Contact</th>
                <th>Balance</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// load and render customer list all customers and builds the table rows
async function loadCustomers() {
    const response = await fetch("/customers");
    const result = await response.json();
    const customers = result.data;

    let rows = "";
    customers.forEach(c => {
        rows += `
            <tr>
                <td>${c.customerId || "N/A"}</td>
                <td>${c.firstName || ""}</td>
                <td>${c.lastName || ""}</td>
                <td>${c.address || "N/A"}</td>
                <td>${c.email || ""}</td>
                <td>${c.phone || ""}</td>
                <td>${c.preferredContact || "N/A"}</td>
                <td>${c.classBalance ?? 0}</td>
                <td>
                    <button class="btn-edit" onclick="editCustomer('${c._id}')">Edit</button>
                    <button class="btn-delete" onclick="deleteCustomer('${c._id}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#customerTable tbody").innerHTML = rows;
}

// confirm and delete by MongoDB ID, then reloads table
async function deleteCustomer(id) {
    if (!confirm("Are you sure you want to delete this customer?")) return;
    await fetch(`/customers/${id}`, { method: "DELETE" });
    loadCustomers();
}

// go to edit form with customer ID in query string
function editCustomer(id) {
    window.location.href = `edit-customer.html?id=${id}`;
}

loadCustomers();
</script>
</body>
</html>
