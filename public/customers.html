<!DOCTYPE html>
<html>
<head>
    <title>Customer List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<h2>Customer List</h2>

<a href="index.html">Home</a>
<br><br>
<a href="add-customer.html">Add New Customer</a>
<br><br>

<table border="1" id="customerTable">
    <thead>
        <tr>
            <th>Customer ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Address</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Preferred Contact</th>
            <th>Class Balance</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
async function loadCustomers() {
    const response = await fetch("/customers");
    const result = await response.json();
    const customers = result.data;

    const tableBody = document.querySelector("#customerTable tbody");

    let rows = "";

    customers.forEach(customer => {
        rows += `
            <tr>
                <td>${customer.customerId || "N/A"}</td>
                <td>${customer.firstName || ""}</td>
                <td>${customer.lastName || ""}</td>
                <td>${customer.address || "N/A"}</td>
                <td>${customer.email || ""}</td>
                <td>${customer.phone || ""}</td>
                <td>${customer.preferredContact || "N/A"}</td>
                <td>${customer.classBalance ?? 0}</td>
                <td>
                    <button onclick="editCustomer('${customer._id}')">Edit</button>
                </td>
                <td>
                    <button onclick="deleteCustomer('${customer._id}')">Delete</button>
                </td>
            </tr>
        `;
    });

    tableBody.innerHTML = rows;
}

async function deleteCustomer(id) {
    const confirmDelete = confirm("Are you sure you want to delete this customer?");
    if (!confirmDelete) return;

    await fetch(`/customers/${id}`, {
        method: "DELETE"
    });

    loadCustomers();
}

function editCustomer(id) {
    window.location.href = `edit-customer.html?id=${id}`;
}

loadCustomers();
</script>

</div>

</body>
</html>
