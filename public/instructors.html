<!DOCTYPE html>
<html>
<head>
    <title>Instructor List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

<a href="index.html">Home</a>
<br><br>
<a href="add-instructor.html">Add New Instructor</a>
<br><br>

<h2>Instructor List</h2>

<table border="1" id="instructorTable">
    <thead>
        <tr>
            <th>Instructor ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Address</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Preferred Contact</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
async function loadInstructors() {
    const response = await fetch("/instructors");
    const result = await response.json();
    const instructors = result.data;

    const tableBody = document.querySelector("#instructorTable tbody");

    let rows = "";

    instructors.forEach(instructor => {
        rows += `
            <tr>
                <td>${instructor.instructorId || "N/A"}</td>
                <td>${instructor.firstName || ""}</td>
                <td>${instructor.lastName || ""}</td>
                <td>${instructor.address || "N/A"}</td>
                <td>${instructor.email || ""}</td>
                <td>${instructor.phone || ""}</td>
                <td>${instructor.preferredContact || "N/A"}</td>
                <td>
                    <button onclick="editInstructor('${instructor._id}')">Edit</button>
                </td>
                <td>
                    <button onclick="deleteInstructor('${instructor._id}')">Delete</button>
                </td>
            </tr>
        `;
    });

    tableBody.innerHTML = rows;
}

async function deleteInstructor(id) {
    const confirmDelete = confirm("Are you sure you want to delete this instructor?");
    if (!confirmDelete) return;

    await fetch(`/instructors/${id}`, {
        method: "DELETE"
    });

    loadInstructors();
}

function editInstructor(id) {
    window.location.href = `edit-instructor.html?id=${id}`;
}

loadInstructors();
</script>

</div>

</body>
</html>
