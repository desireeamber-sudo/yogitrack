<!DOCTYPE html>
<html>
<head>
    <title>Instructor List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Instructor List</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="add-instructor.html">Add New Instructor</a>
    </div>

    <table id="instructorTable">
        <thead>
            <tr>
                <th>Instructor ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Address</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Pref. Contact</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
async function loadInstructors() {
    const response = await fetch("/instructors");
    const result = await response.json();
    const instructors = result.data;

    let rows = "";
    instructors.forEach(i => {
        rows += `
            <tr>
                <td>${i.instructorId || "N/A"}</td>
                <td>${i.firstName || ""}</td>
                <td>${i.lastName || ""}</td>
                <td>${i.address || "N/A"}</td>
                <td>${i.email || ""}</td>
                <td>${i.phone || ""}</td>
                <td>${i.preferredContact || "N/A"}</td>
                <td>
                    <button class="btn-edit" onclick="editInstructor('${i._id}')">Edit</button>
                    <button class="btn-delete" onclick="deleteInstructor('${i._id}')">Delete</button>
                </td>
            </tr>`;
    });
    document.querySelector("#instructorTable tbody").innerHTML = rows;
}

async function deleteInstructor(id) {
    if (!confirm("Are you sure you want to delete this instructor?")) return;
    await fetch(`/instructors/${id}`, { method: "DELETE" });
    loadInstructors();
}

function editInstructor(id) {
    window.location.href = `edit-instructor.html?id=${id}`;
}

loadInstructors();
</script>
</body>
</html>
