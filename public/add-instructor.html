<!DOCTYPE html>
<html>
<head>
    <title>Add Instructor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Add Instructor</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="people.html">Back to People List</a>
    </div>

    <form id="instructorForm">
        <label>First Name:</label><br>
        <input type="text" id="firstName" required><br><br>

        <label>Last Name:</label><br>
        <input type="text" id="lastName" required><br><br>

        <button type="button" id="checkNameBtn" class="btn-check">Check Instructor Name</button>

        <div id="extraFields" style="display: none; margin-top: 20px;">
            <label>Address:</label><br>
            <input type="text" id="address" required><br><br>

            <label>Phone:</label><br>
            <input type="text" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890" required><br><br>

            <label>Email:</label><br>
            <input type="email" id="email" required><br><br>

            <label>Preferred Mode of Communication:</label><br>
            <select id="preferredContact" required>
                <option value="">Select one</option>
                <option value="phone">Phone</option>
                <option value="email">Email</option>
            </select><br><br>

            <button type="submit">Add Instructor</button>
        </div>
    </form>
</div>

<script>
let allowDuplicate = false;

document.getElementById("checkNameBtn").addEventListener("click", async function() {
    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;
    if (!firstName || !lastName) { alert("Please enter first and last name first."); return; }

    const result = await fetch("/instructors").then(r => r.json());
    const duplicate = result.data.find(i => i.firstName === firstName && i.lastName === lastName);

    if (duplicate) {
        if (!confirm("An instructor with that name already exists. Do you want to continue?")) return;
        allowDuplicate = true;
    } else {
        allowDuplicate = false;
    }
    document.getElementById("extraFields").style.display = "block";
});

document.getElementById("instructorForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const instructor = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        address: document.getElementById("address").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        preferredContact: document.getElementById("preferredContact").value
    };

    const response = await fetch("/instructors", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Allow-Duplicate": allowDuplicate ? "true" : "false" },
        body: JSON.stringify(instructor)
    });
    const result = await response.json();
    if (!response.ok) { alert(result.message); return; }

    alert(`Welcome to Yoga H'om! Your instructor id is ${result.data.instructorId}.`);
    window.location.href = "people.html";
});
</script>
</body>
</html>
