<!DOCTYPE html>
<!-- instructor dashboard - instructor role only -->
<html>
<head>
    <title>YogiTrack - Instructor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="logo-mark">🪷</div>
    <h1>YogiTrack</h1>
    <p class="site-sub">Yoga H'om Studio Management</p>
    <div class="button-group">
        <a href="record-attendance.html" class="btn btn-add-customer">Record Attendance</a>
        <a href="attendance.html" class="btn btn-add-instructor">View Attendance</a>
        <a href="classes.html" class="btn btn-people">View Class Schedule</a>
    </div>
    <br>
    <div style="text-align:center;">
        <button onclick="logout()" class="btn-delete" style="padding:8px 20px;">Log Out</button>
    </div>
</div>
<script>
// check that this is actually an instructor
async function checkInstructorRole() {
    const result = await fetch("/auth/me").then(r => r.json()).catch(() => null);
    if (!result || !result.role) {
        window.location.href = "/login.html";
        return;
    }
    if (result.role === "Manager") {
        window.location.href = "/index.html";
    }
}

async function logout() {
    await fetch("/auth/logout", { method: "POST" });
    window.location.href = "/login.html";
}

checkInstructorRole();
</script>
</body>
</html>
